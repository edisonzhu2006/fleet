// fleet.proto: the wire contract between fleetctl, fleetmaster and fleetlet.
//
// WHY THIS EXISTS. Every process in fleet talks over gRPC with these
// messages, so this file is the one place that says what crosses the
// network. The C++ stubs are generated from it at build time
// (proto/CMakeLists.txt), and the CLI, the agent, the master and the
// integration tests all compile against the same generated code.
//
// ONE SERVICE, PULL-BASED. There is no Agent service: the master never
// dials an agent. Each fleetlet calls Master.Heartbeat every 500 ms,
// reporting what it actually runs, and the reply says what to start and
// stop. This is what Borg's Borglet and Kubernetes' kubelet do. It works
// through NAT and firewalls (only the master needs a reachable address),
// an agent that restarts just resumes heartbeating, and a lost message is
// repaired by the next heartbeat because the reply is recomputed from
// desired state every time (level-triggered) rather than being a one-shot
// command that must not be lost (edge-triggered). NOTES.md (m2) has the
// trade-off: a placement waits up to one heartbeat interval to start.
//
// FIELD NUMBERS. Numbers, not names, are what go on the wire. Rules used
// throughout, so master and agents of different versions can coexist
// during a rollout:
//   - numbers 1..15 encode in one byte, so they go to the fields sent on
//     every heartbeat;
//   - a field is never renumbered or reused; a removed field's number goes
//     into `reserved`;
//   - every enum's zero value is UNSPECIFIED, because proto3 decodes an
//     unknown or missing enum as 0 and that must not read as a real state.
// Messages that grew in later milestones note where (m5: the checkpoint
// dir and resume command of stateful tasks).

syntax = "proto3";

package fleet.v1;

// Same units as core/model.h: 1000 milli-CPU is one core; memory in MB.
message Resources {
  int64 milli_cpu = 1;
  int64 memory_mb = 2;
}

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  NODE_STATE_READY = 1;
  NODE_STATE_DRAINING = 2;
  NODE_STATE_DEAD = 3;  // set by the failure detector (m3)
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_SUCCEEDED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_KILLED = 5;
  // Exited, and its restart policy says to run it again once its backoff
  // delay has passed (m3). Not on any node; its quota stays charged.
  TASK_STATE_BACKOFF = 6;
}

// What happens when a task's process exits on its own (m3). Preemption,
// drain and node loss are not exits of the task: those always reschedule
// it, whatever the policy, and never count toward its backoff.
enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;  // treated as NEVER, the m2 behavior
  RESTART_POLICY_NEVER = 1;        // any exit is final
  RESTART_POLICY_ON_FAILURE = 2;   // restart unless it exited 0
  RESTART_POLICY_ALWAYS = 3;       // restart on any exit (services)
}

// ---------------------------------------------------------------- agents

message RegisterNodeRequest {
  string name = 1;                  // stable across agent restarts
  Resources capacity = 2;
  map<string, string> labels = 3;   // e.g. disk=ssd, zone=a
}

message RegisterNodeResponse {
  uint32 node_id = 1;
  // The fencing token (m3). Every registration gets a new epoch from one
  // master-wide counter that only goes up, so a later registration always
  // has a larger epoch than any earlier one. Every task the agent starts
  // is tagged with the epoch it was started under; the master stops any
  // reported task whose epoch is not the node's current one, and refuses
  // a heartbeat carrying an old epoch (FAILED_PRECONDITION: the agent
  // kills everything and registers again). When the failure detector
  // declares a node dead, its epoch is revoked, so the node is fenced off
  // even if it was only partitioned. Since m4 the counter is durable (every
  // registration is a write-ahead-log record, synced before this response
  // is sent), so a restarted master continues above every epoch it ever
  // issued; the wall clock in microseconds is only its starting floor.
  // Was a random "incarnation" in m2; see NOTES.md m3 for why ordering
  // matters.
  fixed64 epoch = 2;          // fixed64: values near 2^51, varint would be 8 bytes too
  uint32 heartbeat_interval_ms = 3; // the master tells agents its cadence
}

// One running copy of a task on one node. task_id alone is not enough:
// a task that is preempted and later placed on the same node again is a
// new attempt, and an exit report from the old attempt must not finish
// the new one.
message TaskInstance {
  uint32 task_id = 1;
  uint32 attempt = 2;      // bumped by the master on every placement
  fixed64 epoch = 3; // node epoch the instance was started in
}

message TaskStatus {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_RUNNING = 1;
    PHASE_EXITED = 2;        // exit_code or signal is set
    PHASE_START_FAILED = 3;  // exec failed; message says why
  }
  TaskInstance instance = 1;
  Phase phase = 2;
  int32 exit_code = 3;  // valid when EXITED and signal == 0
  int32 signal = 4;     // nonzero when the process died of a signal
  string message = 5;
  // The kernel OOM-killed it for exceeding its memory limit (m2b; only a
  // runtime with real enforcement, DockerRuntime, sets it). A separate
  // flag rather than a guess from exit code 137, which also means "any
  // SIGKILL" and is what docker stop's escalation produces.
  bool oom_killed = 6;
}

message HeartbeatRequest {
  uint32 node_id = 1;
  fixed64 epoch = 2;
  // Everything the agent runs, plus exits the master has not yet
  // acknowledged (see HeartbeatResponse.forget). A full report every time,
  // not a delta, so a lost heartbeat loses nothing.
  repeated TaskStatus tasks = 3;
}

// What to run. Grows in later milestones (restart policy, checkpoint dir,
// env); new fields get new numbers and old agents ignore them.
message TaskLaunch {
  TaskInstance instance = 1;
  string job = 2;
  repeated string argv = 3;
  Resources limits = 4;  // the task's request, enforced as far as the runtime can
  // Container image (m2b). Empty: the agent runtime's default. Ignored by
  // ProcessRuntime. An old agent ignores this field and runs argv as a
  // process, which is exactly the m2 behavior.
  string image = 5;
  // Stateful tasks (m5). checkpoint_dir: where the task keeps its
  // checkpoints, on storage every node can reach (one machine: a common
  // directory). Empty: a stateless task, and the two fields below are
  // unused. The agent, not the master, decides between the two command
  // lines, because only the node can look at the checkpoint storage at
  // the moment of the start: argv when there is no committed checkpoint
  // (no MANIFEST in checkpoint_dir), resume_argv when there is one
  // (agent/stateful.h). An old agent ignores these fields and always runs
  // argv, which for streamkit starts over from byte 0 (correct, but loses
  // the progress) or refuses because the directory holds state.
  string checkpoint_dir = 6;
  repeated string resume_argv = 7;
}

message HeartbeatResponse {
  // Instances the master wants running here that the agent did not report.
  // Re-sent on every heartbeat until reported, so the agent must ignore a
  // start for an instance it already has.
  repeated TaskLaunch start = 1;
  // Instances the agent reported running that should not be: killed,
  // preempted, being moved off a draining node, or from a stale epoch.
  repeated TaskInstance stop = 2;
  // Exits the master has recorded; the agent stops reporting them. Until
  // then it reports them every heartbeat, so an exit survives a lost
  // heartbeat or reply.
  repeated TaskInstance forget = 3;
}

// ---------------------------------------------------------------- users

message SubmitRequest {
  string job = 1;      // [A-Za-z0-9._-]{1,64}; also names the log files
  int32 priority = 2;  // 0 batch .. 3 critical
  Resources request = 3;
  map<string, string> required_labels = 4;
  repeated string argv = 5;
  uint32 count = 6;    // number of identical tasks; 0 means 1
  // Container image for DockerRuntime nodes (m2b); empty = the node's
  // default. Validated by the master (see core/model.h valid_image_ref).
  string image = 7;
  RestartPolicy restart_policy = 8;  // m3; unset = NEVER
  // Idempotency key (m4b), chosen by the client, e.g. 128 random bits as
  // hex; empty = none. The first submission with a given id is admitted;
  // any later one with the same id is not admitted again but answered
  // with the first one's task ids. That makes a retry safe after a reply
  // was lost: with replicated masters a client cannot tell "not received"
  // from "committed, then the leader died before replying" (both are
  // UNAVAILABLE), so without it a retry could admit the job twice.
  string request_id = 9;
  // Stateful task (m5): see TaskLaunch.checkpoint_dir. Requires count 1
  // (one checkpoint directory belongs to one task), an absolute path, and
  // a non-empty resume_argv. A stateful task is never chosen as a
  // preemption victim (NOTES.md m5 says why).
  string checkpoint_dir = 10;
  repeated string resume_argv = 11;
}

message SubmitResponse {
  repeated uint32 task_ids = 1;
}

message ListRequest {
  string job = 1;  // empty: all jobs
}

message NodeInfo {
  uint32 id = 1;
  string name = 2;
  NodeState state = 3;
  Resources capacity = 4;
  Resources allocated = 5;
  map<string, string> labels = 6;
  int64 ms_since_heartbeat = 7;
  uint32 running_tasks = 8;
  // The failure detector has missed suspect_after heartbeats in a row
  // (m3). A suspect node keeps its tasks but gets no new ones.
  bool suspect = 9;
  fixed64 epoch = 10;  // current registration; 0 once declared dead
}

message TaskInfo {
  uint32 id = 1;
  string job = 2;
  int32 priority = 3;
  TaskState state = 4;
  Resources request = 5;
  string node = 6;   // node it runs on; if not running, the last one it ran on
  uint32 attempt = 7;
  repeated string argv = 8;
  bool has_exit = 9;  // exit_code / signal / message are meaningful
  int32 exit_code = 10;
  int32 signal = 11;
  string message = 12;
  uint32 preempted_count = 13;
  string image = 14;      // as submitted; empty = the node's default
  bool oom_killed = 15;   // with has_exit: the last attempt was OOM-killed
  RestartPolicy restart_policy = 16;
  uint32 restarts = 17;   // times its restart policy has rerun it
  int64 restart_in_ms = 18;  // when BACKOFF: time left before it is pending again
  string checkpoint_dir = 19;  // m5; empty for a stateless task
}

message ListResponse {
  repeated NodeInfo nodes = 1;
  repeated TaskInfo tasks = 2;
}

message KillRequest {
  oneof target {
    uint32 task_id = 1;
    string job = 2;  // every live task of the job
  }
}

message KillResponse {
  repeated uint32 killed = 1;
}

message DrainRequest {
  string node = 1;
}

message DrainResponse {
  // Tasks on the node when the drain began (m3: drain is graceful). Each
  // is stopped where it runs and rescheduled only after its agent reports
  // it gone, so two copies never run at once. Was "evicted" in m2, when
  // drain requeued them at once; same field number, so the wire is unchanged.
  repeated uint32 moving = 1;
}

// ---------------------------------------------------------- replication

// One replica's view of the Raft group (m4b), for `fleetctl status` and
// the benchmarks. Every replica answers it, leader or not.
message ReplicaStatusRequest {}

message ReplicaStatusResponse {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_FOLLOWER = 1;
    ROLE_CANDIDATE = 2;
    ROLE_LEADER = 3;
  }
  uint32 id = 1;
  Role role = 2;
  uint64 term = 3;
  uint32 leader_id = 4;       // 0: unknown
  string leader_address = 5;
  uint64 commit_index = 6;
  uint64 applied_index = 7;
  uint64 last_index = 8;
  uint64 snapshot_index = 9;
  uint64 lsn = 10;            // of the applied master state
  // The leader, with its term's no-op committed and applied: the one
  // replica that answers agents and fleetctl.
  bool serving = 11;
  bool isolated = 12;         // fault injection active (partition test)
  uint32 replicas = 13;
}

// REPLICATION (m4b). With fleetmaster running as Raft replicas, only the
// leader serves the calls below. Any other replica answers UNAVAILABLE
// with the leader's address, when it knows it, in the trailing metadata
// key "fleet-leader" (common/leader_redirect.h); the client retries there.
// ABORTED means the leader made the call's changes but could not commit
// them before losing its leadership or its majority: they may or may not
// take effect. A standalone fleetmaster (no --peers) behaves as in m4 and
// does not implement ReplicaStatus.
service Master {
  // Agent-facing.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  // NOT_FOUND: unknown node id (a master without a state directory
  // restarted and forgot it): the agent registers again and keeps its
  // tasks, which the master then stops as stale. A master with a state
  // directory (m4) remembers every node and epoch, so after its restart
  // the agent's next heartbeat is simply accepted.
  // FAILED_PRECONDITION: stale or revoked epoch (the node was declared
  // dead, or registered again since): the master may already have
  // rescheduled these tasks elsewhere, so the agent kills every task at
  // once, then registers again (fencing, m3).
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // User-facing (fleetctl).
  // INVALID_ARGUMENT for a bad spec, RESOURCE_EXHAUSTED when over quota.
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Kill(KillRequest) returns (KillResponse);
  rpc Drain(DrainRequest) returns (DrainResponse);

  // Replication (m4b): answered by every replica, never redirected.
  rpc ReplicaStatus(ReplicaStatusRequest) returns (ReplicaStatusResponse);
}
